<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540"><rect width="1000" height="540" fill="white"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Easy-task p50 latency</text><g font-family="Arial"><rect x="95" y="412" width="150" height="38" fill="#4c78a8"/><rect x="315" y="116" width="150" height="334" fill="#4c78a8"/><rect x="535" y="110" width="150" height="340" fill="#4c78a8"/><rect x="755" y="111" width="150" height="339" fill="#4c78a8"/><g text-anchor="middle" font-size="22" font-weight="700"><text x="170" y="397">0.93s</text><text x="390" y="101">8.35s</text><text x="610" y="95">8.51s</text><text x="830" y="96">8.49s</text></g><g text-anchor="middle" font-size="18"><text x="170" y="480">OFF</text><text x="390" y="480">LOW</text><text x="610" y="480">DEFAULT</text><text x="830" y="480">XHIGH</text></g><text x="500" y="520" text-anchor="middle" font-size="15" fill="#555">Thinking-on modes were roughly 9× slower on this bounded simple-task pack</text></g></svg>